<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>黑纱 · 可见缺陷复核</title>
  <style>
    :root{--ink:#182b30;--deep:#10282e;--paper:#eef1eb;--line:#cbd7d0;--green:#19b979;--red:#ee675b;--cyan:#39c8de;--gold:#dba85e}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Microsoft YaHei",sans-serif}button,textarea{font:inherit}button{cursor:pointer}
    header{height:70px;background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:4px solid var(--gold)}
    h1{margin:0;font:600 23px Georgia,"SimSun",serif}.sub{font-size:11px;color:#abc1be;letter-spacing:.12em}header small{color:#b5c7c1}
    main{display:grid;grid-template-columns:220px minmax(520px,1fr) 290px;height:calc(100vh - 70px)}aside{background:#fffefa;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}
    .sideTop,.block{padding:17px;border-bottom:1px solid var(--line)}.tag{font-size:11px;font-weight:800;color:#347469;letter-spacing:.12em;text-transform:uppercase}.count{font:600 27px Georgia,serif;margin:4px 0 9px}.item{width:100%;background:transparent;border:0;border-bottom:1px solid #e5ebe5;text-align:left;padding:11px 15px}.item:hover{background:#f0f5ed}.item.active{background:#e5f1ea}.item b{display:block;font-size:12px}.item small{color:#72847f}.dot{float:right;width:8px;height:8px;border-radius:50%;background:#b7c4bb;margin-top:7px}.dot.done{background:#19a56c}
    .viewer{display:flex;flex-direction:column;min-width:0;background:#26353b}.bar,.foot{background:#e5ece7;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.bar{min-height:57px}.foot{min-height:48px;font-size:12px;color:#5d706c}.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:11px;color:#6a7d77}.stage{flex:1;min-height:0;overflow:auto}.inner{position:relative;line-height:0;min-height:100%}img{display:block;height:auto;max-width:none;user-select:none}canvas{position:absolute;left:0;top:0;touch-action:none;cursor:crosshair}button{border:1px solid #b9c9c0;background:white;padding:8px 10px;color:var(--ink)}button:hover{border-color:#327c6a}.barBtns,.nav,.row{display:flex;gap:6px}.mode{width:100%;text-align:left;margin-top:8px}.mode.active{border:2px solid #19695f;background:#e5f2e9;padding:7px 9px}.helper{font-size:12px;color:#617671;margin:8px 0}.legend{display:flex;gap:10px;font-size:12px;margin-top:9px}.legend span:before{content:"● ";font-weight:900}.legend .g{color:#139b66}.legend .r{color:#d74a43}.legend .c{color:#1897b7}.row{margin:8px 0}.row button{flex:1}.save{width:100%;background:var(--deep);color:#fff;font-weight:700;border:0;padding:12px}.save:hover{background:#1e6058}textarea{width:100%;min-height:90px;border:1px solid var(--line);padding:9px;resize:vertical}.message{min-height:20px;color:#267a66;font-size:12px;margin-top:8px}.error{color:#a53737}a{color:#1b766c}.hint{font-size:11px;color:#778983;margin-top:10px}
    @media(max-width:950px){main{grid-template-columns:160px minmax(380px,1fr) 250px}}@media(max-width:750px){main{display:block;height:auto}.left{height:180px}.viewer{height:64vh}}
  </style>
</head>
<body>
  <header><div><h1>可见黑纱复核</h1><div class="sub">A REVIEW · DEFECT FOLLOW-UP</div></div><small>只标可见缺陷 · 不改 A 锁定结论</small></header>
  <main>
    <aside class="left"><div class="sideTop"><div class="tag">Review queue</div><div class="count" id="count">0 / 7</div><div class="helper">5 张可见黑纱，2 张遮挡待定。</div></div><div id="list"></div></aside>
    <section class="viewer"><div class="bar"><div style="min-width:0"><div id="name" class="name">正在读取…</div><div id="meta" class="meta"></div></div><div class="barBtns"><button id="out">−</button><button id="zoom">适合</button><button id="in">＋</button></div></div><div class="stage" id="stage"><div class="inner"><img id="photo" alt="待复核原图" draggable="false"><canvas id="overlay" aria-label="点击原图绘制可见黑纱中心线"></canvas></div></div><div class="foot"><span>绿色是 A 已锁定框；点击原图沿可见黑纱逐点标线</span><div class="nav"><button id="prev">← 上一张</button><button id="next">下一张 →</button></div></div></section>
    <aside class="right"><div class="block"><div class="tag">Defect detail</div><p class="helper" id="instruction">只画可见的黑纱，不画手。至少点击 2 点，完成后保存。</p><div class="legend"><span class="g">A 框</span><span class="c">黑纱线</span></div><div class="row"><button id="undo">撤销一点</button><button id="clearYarn">清空黑纱线</button></div><div id="shapeInfo" class="helper"></div></div><div class="block"><div class="tag">Notes</div><p class="helper">无法看清黑纱或被遮住时，说明无法定位的原因；不要猜测。</p><textarea id="notes" placeholder="例如：目标被遮住，看不到黑纱走向…"></textarea></div><div class="block"><button id="save" class="save">保存（Ctrl+S）</button><div id="message" class="message"></div><p class="hint">仅保存缺陷复核草稿，不标注或训练手部。A 的 69 张锁定审核表不变。</p><a href="/api/export" target="_blank">查看已保存 JSON</a></div></aside>
  </main>
  <script src="/detail.js"></script>
</body>
</html>
