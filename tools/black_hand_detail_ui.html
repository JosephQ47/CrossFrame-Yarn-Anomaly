<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>黑纱 · 手部精细复核</title>
  <style>
    :root{--ink:#182b30;--deep:#10282e;--paper:#eef1eb;--line:#cbd7d0;--green:#19b979;--red:#ee675b;--cyan:#39c8de;--gold:#dba85e}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Microsoft YaHei",sans-serif}button,textarea{font:inherit}button{cursor:pointer}
    header{height:70px;background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:4px solid var(--gold)}
    h1{margin:0;font:600 23px Georgia,"SimSun",serif}.sub{font-size:11px;color:#abc1be;letter-spacing:.12em}header small{color:#b5c7c1}
    main{display:grid;grid-template-columns:220px minmax(520px,1fr) 290px;height:calc(100vh - 70px)}aside{background:#fffefa;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}
    .sideTop,.block{padding:17px;border-bottom:1px solid var(--line)}.tag{font-size:11px;font-weight:800;color:#347469;letter-spacing:.12em;text-transform:uppercase}.count{font:600 27px Georgia,serif;margin:4px 0 9px}.item{width:100%;background:transparent;border:0;border-bottom:1px solid #e5ebe5;text-align:left;padding:11px 15px}.item:hover{background:#f0f5ed}.item.active{background:#e5f1ea}.item b{display:block;font-size:12px}.item small{color:#72847f}.dot{float:right;width:8px;height:8px;border-radius:50%;background:#b7c4bb;margin-top:7px}.dot.done{background:#19a56c}
    .viewer{display:flex;flex-direction:column;min-width:0;background:#26353b}.bar,.foot{background:#e5ece7;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.bar{min-height:57px}.foot{min-height:48px;font-size:12px;color:#5d706c}.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:11px;color:#6a7d77}.stage{flex:1;min-height:0;overflow:auto}.inner{position:relative;line-height:0;min-height:100%}img{display:block;height:auto;max-width:none;user-select:none}canvas{position:absolute;left:0;top:0;touch-action:none;cursor:crosshair}button{border:1px solid #b9c9c0;background:white;padding:8px 10px;color:var(--ink)}button:hover{border-color:#327c6a}.barBtns,.nav,.row{display:flex;gap:6px}.mode{width:100%;text-align:left;margin-top:8px}.mode.active{border:2px solid #19695f;background:#e5f2e9;padding:7px 9px}.helper{font-size:12px;color:#617671;margin:8px 0}.legend{display:flex;gap:10px;font-size:12px;margin-top:9px}.legend span:before{content:"● ";font-weight:900}.legend .g{color:#139b66}.legend .r{color:#d74a43}.legend .c{color:#1897b7}.row{margin:8px 0}.row button{flex:1}.save{width:100%;background:var(--deep);color:#fff;font-weight:700;border:0;padding:12px}.save:hover{background:#1e6058}textarea{width:100%;min-height:90px;border:1px solid var(--line);padding:9px;resize:vertical}.message{min-height:20px;color:#267a66;font-size:12px;margin-top:8px}.error{color:#a53737}a{color:#1b766c}.hint{font-size:11px;color:#778983;margin-top:10px}
    @media(max-width:950px){main{grid-template-columns:160px minmax(380px,1fr) 250px}}@media(max-width:750px){main{display:block;height:auto}.left{height:180px}.viewer{height:64vh}}
  </style>
</head>
<body>
  <header><div><h1>手部轮廓与黑纱中心线</h1><div class="sub">A REVIEW · DETAIL FOLLOW-UP</div></div><small>原图标注 · 独立草稿 · 不改 A 锁定结论</small></header>
  <main>
    <aside class="left"><div class="sideTop"><div class="tag">Review queue</div><div class="count" id="count">0 / 7</div><div class="helper">5 张可见黑纱，2 张遮挡待定。</div></div><div id="list"></div></aside>
    <section class="viewer"><div class="bar"><div style="min-width:0"><div id="name" class="name">正在读取…</div><div id="meta" class="meta"></div></div><div class="barBtns"><button id="out">−</button><button id="zoom">适合</button><button id="in">＋</button></div></div><div class="stage" id="stage"><div class="inner"><img id="photo" alt="待复核原图" draggable="false"><canvas id="overlay" aria-label="点击原图绘制手部轮廓或黑纱中心线"></canvas></div></div><div class="foot"><span>点击添加点 · 放大后可沿黑纱走向标线 · 绿色是 A 已锁定框</span><div class="nav"><button id="prev">← 上一张</button><button id="next">下一张 →</button></div></div></section>
    <aside class="right"><div class="block"><div class="tag">Draw mode</div><button class="mode active" id="modeHand">① 手部轮廓：沿可见手臂/手边缘逐点点击</button><button class="mode" id="modeYarn">② 黑纱中心线：沿可见黑纱逐点点击</button><div class="legend"><span class="g">A 框</span><span class="r">手轮廓</span><span class="c">黑纱线</span></div><p class="helper">手部轮廓至少 3 点；黑纱中心线至少 2 点。遮挡待定图只画手，不猜黑纱。</p><div class="row"><button id="finish">完成当前线条</button><button id="undo">撤销一点</button></div><div class="row"><button id="clearHand">删除最后手轮廓</button><button id="clearYarn">清空黑纱线</button></div><div id="shapeInfo" class="helper"></div></div><div class="block"><div class="tag">Notes</div><p class="helper">无法看清黑纱，或手部边界与黑纱重叠时请说明。</p><textarea id="notes" placeholder="例如：手遮住目标；中心线只能画可见部分…"></textarea></div><div class="block"><button id="save" class="save">保存（Ctrl+S）</button><div id="message" class="message"></div><p class="hint">记录追加保存在本机 outputs，不改变审核人 A 的 69 张锁定表。模型不会自动使用这些草稿。</p><a href="/api/export" target="_blank">查看已保存 JSON</a></div></aside>
  </main>
  <script>
    const $=id=>document.getElementById(id),state={items:[],index:0,hand:[],line:[],draft:[],mode:'hand',zoom:1,dirty:false};
    function cur(){return state.items[state.index]}
    function msg(text,error=false){$('message').textContent=text;$('message').className='message'+(error?' error':'')}
    function dirty(){state.dirty=true;msg('尚未保存')}
    function list(){const done=state.items.filter(x=>x.detail).length;$('count').textContent=`${done} / ${state.items.length}`;$('list').replaceChildren();state.items.forEach((x,i)=>{const b=document.createElement('button');b.className='item'+(i===state.index?' active':'');b.innerHTML='<span class="dot"></span><b></b><small></small>';b.querySelector('b').textContent=x.frame_id;b.querySelector('small').textContent=`${x.cam} · ${x.status==='black_yarn'?'可见黑纱':'遮挡待定'}`;if(x.detail)b.querySelector('.dot').classList.add('done');b.onclick=()=>go(i);$('list').append(b)})}
    function info(){$('shapeInfo').textContent=`已保存手轮廓 ${state.hand.length} 条 · 黑纱中心线 ${state.line.length} 点 · 当前未完成 ${state.draft.length} 点`}
    function show(){const x=cur(),d=x.detail||{};state.hand=(d.hand_polygons||[]).map(p=>p.map(q=>[...q]));state.line=(d.yarn_centerline||[]).map(q=>[...q]);state.draft=[];state.mode='hand';state.zoom=1;state.dirty=false;$('modeHand').classList.add('active');$('modeYarn').classList.remove('active');$('modeYarn').disabled=x.status!=='black_yarn';$('photo').removeAttribute('src');$('photo').style.width='100%';$('photo').src=`/image/${encodeURIComponent(x.frame_id)}`;$('name').textContent=x.frame_id;$('meta').textContent=`${state.index+1} / ${state.items.length} · ${x.cam} · ${x.status}`;$('notes').value=d.notes||'';msg(x.detail?'已保存精细草稿':'尚未精细标注');info();list()}
    function resize(){const im=$('photo'),c=$('overlay');if(!im.naturalWidth)return;const dpr=devicePixelRatio||1;c.style.width=im.clientWidth+'px';c.style.height=im.clientHeight+'px';c.width=Math.round(im.clientWidth*dpr);c.height=Math.round(im.clientHeight*dpr);draw()}
    function draw(){const im=$('photo'),c=$('overlay');if(!im.naturalWidth)return;const ctx=c.getContext('2d'),dpr=devicePixelRatio||1,sx=im.clientWidth/im.naturalWidth,sy=im.clientHeight/im.naturalHeight;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,im.clientWidth,im.clientHeight);for(const b of cur().a_boxes){ctx.strokeStyle='#19b979';ctx.lineWidth=3;ctx.strokeRect(b[0]*sx,b[1]*sy,(b[2]-b[0])*sx,(b[3]-b[1])*sy)}function path(points,color,close,fill){if(!points.length)return;ctx.beginPath();ctx.moveTo(points[0][0]*sx,points[0][1]*sy);for(const p of points.slice(1))ctx.lineTo(p[0]*sx,p[1]*sy);if(close)ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=color;ctx.lineWidth=3;ctx.stroke();for(const p of points){ctx.beginPath();ctx.arc(p[0]*sx,p[1]*sy,4,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}}state.hand.forEach(p=>path(p,'#ee675b',true,'rgba(238,103,91,.16)'));path(state.line,'#39c8de',false);path(state.draft,state.mode==='hand'?'#ffb58a':'#a6e9f4',false)}
    function point(e){const r=$('overlay').getBoundingClientRect(),im=$('photo');return [Math.round(Math.max(0,Math.min(im.naturalWidth,(e.clientX-r.left)*im.naturalWidth/r.width))),Math.round(Math.max(0,Math.min(im.naturalHeight,(e.clientY-r.top)*im.naturalHeight/r.height)))]}
    $('overlay').onclick=e=>{if(!$('photo').naturalWidth)return;state.draft.push(point(e));dirty();info();draw()};
    function finish(){if(!state.draft.length)return true;if(state.mode==='hand'){if(state.draft.length<3){msg('手轮廓至少需要 3 点',true);return false}state.hand.push(state.draft)}else{if(state.draft.length<2){msg('黑纱中心线至少需要 2 点',true);return false}state.line=state.draft}state.draft=[];dirty();info();draw();return true}
    async function save(){if(!finish())return false;const x=cur();try{const r=await fetch(`/api/items/${encodeURIComponent(x.frame_id)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hand_polygons:state.hand,yarn_centerline:state.line,notes:$('notes').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'保存失败');x.detail={hand_polygons:state.hand.map(p=>p.map(q=>[...q])),yarn_centerline:state.line.map(q=>[...q]),notes:$('notes').value,reviewed_at_utc:data.reviewed_at_utc};state.dirty=false;msg('已保存本机精细草稿');list();return true}catch(e){msg(e.message,true);return false}}
    async function go(i){if(i<0||i>=state.items.length||i===state.index)return;if(state.dirty&&!(await save()))return;state.index=i;show()}
    function zoom(v){state.zoom=Math.min(4,Math.max(1,v));$('photo').style.width=`${state.zoom*100}%`;requestAnimationFrame(resize)}
    $('photo').onload=resize;new ResizeObserver(resize).observe($('photo'));$('modeHand').onclick=()=>{if(!finish())return;state.mode='hand';$('modeHand').classList.add('active');$('modeYarn').classList.remove('active')};$('modeYarn').onclick=()=>{if(!finish())return;state.mode='yarn';$('modeYarn').classList.add('active');$('modeHand').classList.remove('active')};$('finish').onclick=finish;$('undo').onclick=()=>{if(state.draft.length)state.draft.pop();else if(state.mode==='yarn'&&state.line.length)state.line.pop();else if(state.mode==='hand'&&state.hand.length)state.hand.pop();dirty();info();draw()};$('clearHand').onclick=()=>{state.hand.pop();dirty();info();draw()};$('clearYarn').onclick=()=>{state.line=[];state.draft=[];dirty();info();draw()};$('notes').oninput=dirty;$('save').onclick=save;$('prev').onclick=()=>go(state.index-1);$('next').onclick=()=>go(state.index+1);$('in').onclick=()=>zoom(state.zoom+.5);$('out').onclick=()=>zoom(state.zoom-.5);$('zoom').onclick=()=>zoom(1);
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}else if(!['TEXTAREA','INPUT'].includes(document.activeElement.tagName)){if(e.key==='ArrowRight')go(state.index+1);if(e.key==='ArrowLeft')go(state.index-1)}});
    fetch('/api/items').then(r=>r.json()).then(items=>{if(!Array.isArray(items))throw Error(items.error||'载入失败');state.items=items;show()}).catch(e=>{msg(e.message,true);$('name').textContent='读取失败'});
  </script>
</body>
</html>
